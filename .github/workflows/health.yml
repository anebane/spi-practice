name: health

# 外形監視。外から見て壊れていないかを毎日1回だけ確認する。
#
# なぜ日次で足りるか: 検知したい事故（301切れ・証明書更新失敗・リンク切れ）は
# どれも放置すれば数週間続くもので、数時間で自然に直る類ではない。
# 日次で捕まえれば損失は最大1日分。逆に鳴りすぎる監視は無視されるようになり、
# 本物の異常を見逃す。だから頻度を上げない。
#
# なぜ Mac の launchd ではなく Actions か: Mac が寝ている間は動かないから。
# 繁忙期(12〜4月)に旅行していても回り続ける必要がある。
#
# 通知: 失敗すると GitHub からメールが届く。成功時は何も鳴らない。

on:
  schedule:
    - cron: "0 0 * * *" # 毎日 09:00 JST
  workflow_dispatch: # 手動実行用

permissions:
  contents: read

env:
  SITE: https://tekisei-drill.com
  OLD_SITE: https://anebane.github.io/spi-practice/
  GA4_ID: G-SPDZ1K30TB

defaults:
  run:
    shell: bash

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: トップページが 200 を返すか
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 --retry 3 --retry-delay 5 -o /dev/null -w '%{http_code}' "$SITE/")
          echo "code=$code"
          [ "$code" = "200" ] || { echo "::error::トップページが $code を返しています"; exit 1; }

      - name: 旧ドメインからの 301 が生きているか（最重要）
        # 3ヶ月分の検索評価をこのリダイレクトで引き継いでいる。
        # 切れると評価が失われ、復旧しても元には戻らない。
        run: |
          set -euo pipefail
          read -r code dest <<< "$(curl -sS --max-time 20 --retry 3 --retry-delay 5 -o /dev/null -w '%{http_code} %{redirect_url}' "$OLD_SITE")"
          echo "code=$code dest=$dest"
          [ "$code" = "301" ] || { echo "::error::旧ドメインが 301 ではなく $code を返しています"; exit 1; }
          case "$dest" in
            "$SITE"/*|"$SITE") ;;
            *) echo "::error::301 の飛び先が想定外です: $dest"; exit 1 ;;
          esac

      - name: www と HTTP が apex に 301 するか
        run: |
          set -euo pipefail
          fail=0
          for u in "https://www.tekisei-drill.com/" "http://tekisei-drill.com/"; do
            read -r code dest <<< "$(curl -sS --max-time 20 --retry 3 --retry-delay 5 -o /dev/null -w '%{http_code} %{redirect_url}' "$u")"
            echo "$u -> $code $dest"
            [ "$code" = "301" ] || { echo "::error::$u が 301 ではなく $code"; fail=1; }
          done
          exit $fail

      - name: TLS 証明書の残日数（14日未満で失敗）
        # GitHub Pages の Let's Encrypt 自動更新は期限の約30日前に走る。
        # そのとき Cloudflare の Proxy status が Proxied に戻っていると
        # ドメイン検証が阻まれて更新が失敗する（UIの既定値が Proxied なのが罠）。
        # 14日を切っていたら更新が失敗していると考えてよい。
        # 日付文字列のパースは環境差が出るので openssl の -checkend に任せる。
        run: |
          set -euo pipefail
          echo | openssl s_client -servername tekisei-drill.com \
                 -connect tekisei-drill.com:443 2>/dev/null > /tmp/cert.pem
          openssl x509 -in /tmp/cert.pem -noout -enddate
          if ! openssl x509 -in /tmp/cert.pem -noout -checkend $((14 * 86400)); then
            echo "::error::証明書の残りが14日未満です。Cloudflare の Proxy status が DNS only(グレー雲) か確認してください"
            exit 1
          fi
          echo "OK: 残り14日以上"

      - name: sitemap の全 URL が 200 か
        # リンク切れ(404)が AdSense 審査の不合格原因になった事例がある。
        run: |
          set -euo pipefail
          urls=$(curl -sS --max-time 20 --retry 3 --retry-delay 5 "$SITE/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//')
          [ -n "$urls" ] || { echo "::error::sitemap.xml から URL を取得できません"; exit 1; }
          fail=0
          while read -r u; do
            code=$(curl -sS --max-time 20 --retry 3 --retry-delay 5 -o /dev/null -w '%{http_code}' "$u")
            echo "$code $u"
            [ "$code" = "200" ] || { echo "::error::$u が $code"; fail=1; }
          done <<< "$urls"
          exit $fail

      - name: 規約3ページが 200 か
        # noindex にしてあるので sitemap には載せていないが、
        # AdSense 審査ではプライバシーポリシーの存在が見られる。
        run: |
          set -euo pipefail
          fail=0
          for p in about.html privacy.html contact.html; do
            code=$(curl -sS --max-time 20 --retry 3 --retry-delay 5 -o /dev/null -w '%{http_code}' "$SITE/$p")
            echo "$code $p"
            [ "$code" = "200" ] || { echo "::error::$p が $code"; fail=1; }
          done
          exit $fail

      - name: GA4 の計測タグが生きているか
        # タグが消えると効果測定が止まるが、サイトは正常に見えるので気づけない。
        run: |
          set -euo pipefail
          if ! curl -sS --max-time 20 --retry 3 --retry-delay 5 "$SITE/" | grep -q "$GA4_ID"; then
            echo "::error::トップページに GA4 タグ($GA4_ID)が見つかりません"
            exit 1
          fi
          echo "OK: $GA4_ID"
