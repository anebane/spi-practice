name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 が要る。sw.js の VERSION 上げ忘れ検査が履歴を遡るため。
      # 既定の浅いクローンだと判定できず、pwa.spec.js が「検査できない」で落ちる。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # test/tools.spec.js は取得系(tools/gsc・tools/ga4)にモックを注入して動かす。
      # 本物のAPIは叩かないが、モジュールの import は本物なのでライブラリが要る。
      #
      # ⚠️ 無ければスキップ、にしてはいけない。CIでは取得系を一度も検査しないのに
      #    緑になる。実際 2026-08-29〜30 に4回連続でCIが落ちたのはこれが無かったため。
      #    検査は「実験台が動かない＝1本も見ていない」と正しく落ちていた。
      - name: Python の依存（取得系の検査に要る）
        run: pip install --quiet google-api-python-client google-analytics-data

      # src/questions/ を編集して questions.js の再生成を忘れると、
      # ソースと配信物がズレたまま公開されてしまう。それを防ぐ。
      - name: questions.js がソースと一致しているか
        run: |
          node tools/build-questions.js
          if ! git diff --quiet questions.js; then
            echo "::error::questions.js が src/questions/ と一致していません。"
            echo "`node tools/build-questions.js` を実行してコミットしてください。"
            git diff --stat questions.js
            exit 1
          fi

      - name: 問題ジェネレータの検証（79テンプレート x 1000回）
        run: ITERATIONS=1000 node test/generator.spec.js

      - name: HTMLの健全性（未展開の変数・壊れた内部リンク）
        run: node test/html.spec.js

      # 景表法（ステマ規制）の表示義務と、広告主が明記した提携維持の条件。
      # ⚠️ この検査は作られてから一度もCIで走っていなかった。
      #    「AUDIENCES が消えても気づけない」を直した先が、そもそも
      #    走っていなかった。検査は書いただけでは動かない。
      - name: 広告枠の不変条件（PR表記・案件ごとの注記・属性の枠）
        run: node test/affiliate.spec.js

      # 記事ページの計測。短い記事で読了が一度も送られていなかった。
      # 「読まれていない」と「測れていない」は意味が違う。
      - name: 記事ページの計測（短い記事でも読了が測れるか）
        run: node test/analytics.spec.js

      # 取得系が空・部分・スキーマ変更のとき黙って書かないか。
      # 空を書くと、その上の分析と週次レポートが「アクセスが消えた」という
      # 嘘を事実の顔で運ぶ。tools/ は Python なので、これまで
      # 破壊テストの分母に入っていなかった。
      - name: 取得系の空・異常応答（tools/gsc・tools/ga4）
        run: node test/tools.spec.js

      # 「書いたのに走らない」を止める。affiliate.spec.js は作られてから
      # 一度もCIで実行されていなかった。spec を1つ作るたびに3か所へ
      # 手で登録する構造で、うち2か所は書き忘れても何も起きなかった。
      # 台帳のルール（理由・分類の接頭辞・増減）が機械で効いているか。
      # 変異を1件も回さないので速い。全件実行の前に落とせる。
      - name: 台帳のルール
        run: node test/mutation-runner.js --check-ledger

      # 出題プロファイル（src/questions/_profile.js）が唯一の出所になっているか。
      # 分野の一覧は以前 index.html と app.js に二重に書かれていて、
      # 片方だけ直しても何も落ちず静かにずれた。宣言と実体を突き合わせる。
      - name: 出題プロファイルと実体の整合
        run: node test/profile.spec.js

      - name: 検査の登録漏れ（CIと破壊テストの両方に載っているか）
        run: node test/wiring.spec.js

      # sw.js のプリキャッシュ対象やアイコンは、消しても画面上は無症状のまま
      # インストール不能になるので機械的に落とす
      - name: PWA構成（manifest・アイコン・Service Workerのプリキャッシュ）
        run: node test/pwa.spec.js

      # 「押した先が期待した状態になるか」を見る検査。
      # ?cat=12 が壊れていた（語句の関係を押すと非言語の模試が始まる）のを
      # 公開直前に偶然見つけた。リンクを増やせば自動で対象が増える。
      - name: 導線のE2E（?cat= のリンクが実際にその分野を出すか）
        run: node test/deeplink.spec.js

      # ⚠️ find の一意性は全体で1回しか判定できない。分割実行では各シャードが
      #    自分の担当ぶんしか見ないので、ここで全件まとめて確かめる。
      #    変異を1件も当てないので速い。
      - name: 変異定義（名前・対象・findの一意性・行数）
        run: node test/mutation-runner.js --check-mutations

      # 計測の壊れ方は画面上が無症状なので、気づけるのは数か月後の集計になる。
      # exam_start と exam_finish が1対1であることを機械で守る。
      - name: 画面ロジックの計測（exam_start と exam_finish の対応）
        run: node test/app.spec.js

  # 破壊テスト（検査が本当に落ちるか）。
  # 「壊して落ちることを確認してから報告する」を口約束ではなく仕組みにする。
  # 検査側の欠陥（5択でNaN / ガードの隠し合い / ハーネスの作り直し / TDZ /
  # 検査を足したことで既存変異が無効化）は、すべてこれで出ている。
  #
  # 225件超を直列で回すと13〜34分かかるので分割する。
  # 分割数は実測で決めた（2026-08-30 ローカル）:
  #   直列の総作業量 約26分。spec 1回の実行は generator 16.6秒 / wiring 6.4秒 /
  #   他は0.1秒前後で、generator を狙う変異46件が所要時間を支配する。
  #   4分割 約7.8分 / 6分割 約5.6分 / 8分割 約4.6分（+ジョブ起動 約1分）。
  #   8以上は短縮幅が縮む一方でジョブ起動の総和が増えるので6にした。
  #   ⚠️ 変異が増えたらこの数字を上げる。いまは46件のgeneratorが下限を決めている。
  # ⚠️ 未カバーの判定はここではしない。各シャードは自分が回した変異の発火しか
  #    知らないので、シャード単位で判定すると全シャードが「未カバーだらけ」と
  #    誤報する。判定は下の集約ジョブが、全シャードの発火の和集合で行う。
  # ⚠️ 同じ作業ツリーを書き換えるので、1つのシャードの中では直列に走らせること。
  mutation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # 1つ落ちても他を最後まで回す（全体像が要る）
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python の依存（取得系の検査に要る）
        run: pip install --quiet google-api-python-client google-analytics-data

      - name: 破壊テスト（${{ matrix.shard }}/6）
        run: node test/mutation-runner.js --shard ${{ matrix.shard }}/6 --coverage-out cov-${{ matrix.shard }}.log

      # 発火記録を集約ジョブへ渡す。ここが欠けると未カバーの判定が成立しない。
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shard }}
          path: cov-${{ matrix.shard }}.log
          if-no-files-found: error

  # 全シャードの発火記録を合わせて、未カバーの失敗経路を判定する。
  # ⚠️ needs で失敗は伝播するが、それだけに頼らない。記録の本数を突き合わせる。
  #    シャードが静かに落ちて記録が欠けたまま集約すると、
  #    「未カバー0件」ではなく「そのシャードのぶんを見ていない」になる。
  coverage:
    runs-on: ubuntu-latest
    needs: mutation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: cov
      - name: 未カバーの失敗経路（全シャードの発火を合わせて判定）
        run: node test/mutation-runner.js --coverage-check cov --expect-shards 6
