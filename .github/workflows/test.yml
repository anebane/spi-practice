name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 が要る。sw.js の VERSION 上げ忘れ検査が履歴を遡るため。
      # 既定の浅いクローンだと判定できず、pwa.spec.js が「検査できない」で落ちる。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # src/questions/ を編集して questions.js の再生成を忘れると、
      # ソースと配信物がズレたまま公開されてしまう。それを防ぐ。
      - name: questions.js がソースと一致しているか
        run: |
          node tools/build-questions.js
          if ! git diff --quiet questions.js; then
            echo "::error::questions.js が src/questions/ と一致していません。"
            echo "`node tools/build-questions.js` を実行してコミットしてください。"
            git diff --stat questions.js
            exit 1
          fi

      - name: 問題ジェネレータの検証（79テンプレート x 1000回）
        run: ITERATIONS=1000 node test/generator.spec.js

      - name: HTMLの健全性（未展開の変数・壊れた内部リンク）
        run: node test/html.spec.js

      # 景表法（ステマ規制）の表示義務と、広告主が明記した提携維持の条件。
      # ⚠️ この検査は作られてから一度もCIで走っていなかった。
      #    「AUDIENCES が消えても気づけない」を直した先が、そもそも
      #    走っていなかった。検査は書いただけでは動かない。
      - name: 広告枠の不変条件（PR表記・案件ごとの注記・属性の枠）
        run: node test/affiliate.spec.js

      # 記事ページの計測。短い記事で読了が一度も送られていなかった。
      # 「読まれていない」と「測れていない」は意味が違う。
      - name: 記事ページの計測（短い記事でも読了が測れるか）
        run: node test/analytics.spec.js

      # 「書いたのに走らない」を止める。affiliate.spec.js は作られてから
      # 一度もCIで実行されていなかった。spec を1つ作るたびに3か所へ
      # 手で登録する構造で、うち2か所は書き忘れても何も起きなかった。
      - name: 検査の登録漏れ（CIと破壊テストの両方に載っているか）
        run: node test/wiring.spec.js

      # sw.js のプリキャッシュ対象やアイコンは、消しても画面上は無症状のまま
      # インストール不能になるので機械的に落とす
      - name: PWA構成（manifest・アイコン・Service Workerのプリキャッシュ）
        run: node test/pwa.spec.js

      # 「押した先が期待した状態になるか」を見る検査。
      # ?cat=12 が壊れていた（語句の関係を押すと非言語の模試が始まる）のを
      # 公開直前に偶然見つけた。リンクを増やせば自動で対象が増える。
      - name: 導線のE2E（?cat= のリンクが実際にその分野を出すか）
        run: node test/deeplink.spec.js

      # 検査そのものが効いているかを確かめる（テストのテスト）。
      # 「壊して落ちることを確認してから報告する」を口約束ではなく仕組みにする。
      # 3回とも、これで検査側の欠陥（5択でNaN / ガードの隠し合い /
      # ハーネスの作り直し）が出ている。
      # 通常のテストより遅い（3分程度）ので別ステップにしてある。
      # ⚠️ 他のジョブと並行して同じ作業ツリーを書き換えないこと。
      - name: 破壊テスト（検査が本当に落ちるか）
        run: node test/mutation-runner.js

      # 計測の壊れ方は画面上が無症状なので、気づけるのは数か月後の集計になる。
      # exam_start と exam_finish が1対1であることを機械で守る。
      - name: 画面ロジックの計測（exam_start と exam_finish の対応）
        run: node test/app.spec.js
